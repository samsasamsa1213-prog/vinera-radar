    function makeIcon(type){const meta=METADATA[type]||METADATA['БПЛА'];return L.divIcon({className:'',html:'<div class="pulse-marker" style="width:22px;height:22px;background:'+meta.color+';color:'+meta.color+';">'+meta.svg+'</div>',iconSize:[22,22],iconAnchor:[11,11]});}
    function isConfirmed(m){return markersData.some(o=>o.id!==m.id&&o.type===m.type&&map.distance([o.lat,o.lng],[m.lat,m.lng])<=300);}
    function popupHtml(m){const meta=METADATA[m.type]||METADATA['БПЛА'];const confirmed=isConfirmed(m);return '<div class="popup-title">'+meta.svg+' '+escapeHtml(m.type)+'</div><div class="popup-muted">Поставил: <b>'+escapeHtml(m.author)+'</b></div><div class="popup-muted">Район: '+escapeHtml(m.address||'определяется...')+'</div><div class="popup-muted">'+new Date(m.created_at).toLocaleString('ru-RU')+'</div>'+(confirmed?'<div class="popup-confirm">✔ Статус подтверждён</div>':'');}
    function drawMarkers(){layerGroup.clearLayers();Object.keys(markerRefs).forEach(k=>delete markerRefs[k]);markersData.forEach(m=>{const marker=L.marker([m.lat,m.lng],{icon:makeIcon(m.type)}).addTo(layerGroup);marker.bindPopup(popupHtml(m));markerRefs[m.id]=marker;});}
    async function loadMarkers(){const{data,error}=await supabaseClient.from('vinera_markers').select('*').order('created_at',{ascending:true});if(error){document.getElementById('status').innerText='Ошибка загрузки: '+error.message;return;}const now=Date.now();markersData=(data||[]).filter(m=>(now-new Date(m.created_at).getTime())<LIFETIME_MS);drawMarkers();updateCityStatus();}
    async function resolveAddress(m){try{const url='https://nominatim.openstreetmap.org/reverse?format=json&lat='+m.lat+'&lon='+m.lng+'&zoom=14&accept-language=ru';const res=await fetch(url);const data=await res.json();const a=data.address||{};const parts=[a.city||a.town||a.village||a.county,a.suburb||a.neighbourhood||a.road];const address=parts.filter(Boolean).join(', ')||(data.display_name||'неизвестно');await supabaseClient.from('vinera_markers').update({address:address}).eq('id',m.id);m.address=address;if(markerRefs[m.id])markerRefs[m.id].setPopupContent(popupHtml(m));}catch(e){}}
    function pluralizeStatus(types){const threats=types.filter(t=>t!=='Тихо');if(threats.length===0)return{text:types.length===0?'—':'Тихо',danger:false};const counts={};threats.forEach(t=>counts[t]=(counts[t]||0)+1);const unique=Object.keys(counts);const hasDanger=unique.some(t=>dangerTypes.includes(t));const pm={'Взрыв':'Взрывы','Сирена':'Сирены','Ракета':'Ракеты','БПЛА':'БПЛА','Истребитель':'Истребители'};const labels=unique.map(t=>counts[t]>1?(pm[t]||t):t);return{text:'⚠ '+labels.join(' · '),danger:hasDanger};}
    function updateCityStatus(){const box=document.getElementById('city-status'),nameEl=box.querySelector('.city-name'),stateEl=box.querySelector('.city-state');nameEl.textContent=(currentCity||'ГОРОД НЕ ВЫБРАН').toUpperCase();if(!currentCity){stateEl.textContent='—';box.classList.remove('danger');return;}const types=markersData.filter(m=>m.city===currentCity).map(m=>m.type);const res=pluralizeStatus(types);stateEl.textContent=res.text;box.classList.toggle('danger',res.danger);}
    window.setMarkerType=function(type,btn){currentMarkerType=type;document.querySelectorAll('.marker-btn').forEach(b=>b.classList.remove('selected'));if(btn)btn.classList.add('selected');document.getElementById('status').innerText='Выбран: '+type+'. Кликните на карту.';};
    map.on('click',async function(e){
        if(currentBanned){document.getElementById('status').innerText='Вы заблокированы';return;}
        if(!currentPhoneVerified){document.getElementById('status').innerHTML='<span style="color:#ff5252;font-weight:bold;">⚠ Подтвердите номер в боте!</span> <a href="https://t.me/vinera_radar_bot" target="_blank" style="color:#00bfa5;">Перейти</a>';return;}
        if(!currentCity){document.getElementById('status').innerText='Сначала найдите город через поиск!';return;}
        const check=canPlaceMarker();if(!check.allowed){document.getElementById('status').innerText='⏳ Подождите '+check.wait+' сек. (лимит 2 метки за 30 сек)';return;}const m={type:currentMarkerType,lat:e.latlng.lat,lng:e.latlng.lng,city:currentCity,author:currentUser,address:'определяется...'};const{data,error}=await supabaseClient.from('vinera_markers').insert([m]).select().single();if(error){document.getElementById('status').innerText='Ошибка сохранения: '+error.message;return;}recentMarkerTimes.push(Date.now());markersData.push(data);drawMarkers();updateCityStatus();resolveAddress(data);document.getElementById('status').innerText='Метка поставлена ✔ (осталось: '+(MAX_MARKERS-recentMarkerTimes.length)+')';if(currentUser){const{data:p}=await supabaseClient.from('profiles').select('total_markers').eq('username',currentUser).single();if(p){await supabaseClient.from('profiles').update({total_markers:(p.total_markers||0)+1}).eq('username',currentUser);}}});
    window.searchCity=async function(){const city=document.getElementById('city-input').value.trim();if(!city)return;document.getElementById('status').innerText='Поиск...';try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(city));const data=await res.json();if(data&&data.length>0){map.setView([parseFloat(data[0].lat),parseFloat(data[0].lon)],12);document.getElementById('status').innerText='Найден: '+data[0].display_name;currentCity=data[0].display_name.split(',')[0].trim();updateCityStatus();}else{document.getElementById('status').innerText='Город не найден';}}catch(e){document.getElementById('status').innerText='Ошибка поиска';}};
    window.toggleMenu=function(){document.getElementById('menu-panel').classList.toggle('open');};
        let adminOpen=false,adminTab='markers';
    window.toggleAdmin=function(){
        // Жесткая проверка: только для bihepka или тех, у кого роль admin/moderator
        const isOwner=(currentUser==='bihepka');
        const isModerator=(currentRole==='moderator'||currentRole==='admin');
        if(!isOwner&&!isModerator)return;
        adminOpen=!adminOpen;
        if(!isOwner)adminTab='markers';
        renderAdmin();
    };
    function renderAdmin(){
        const list=document.getElementById('admin-list');
        list.innerHTML='';
        if(!adminOpen)return;
        const isOwner=(currentUser==='bihepka');
        let tabs='<div style="display:flex;gap:6px;margin-bottom:10px;">';
        tabs+='<button id="tab-markers" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+(adminTab==='markers'?'#00bfa5':'#005a52')+';background:'+(adminTab==='markers'?'#003a36':'transparent')+';color:'+(adminTab==='markers'?'#00bfa5':'#4db6ac')+';font-weight:700;font-size:12px;cursor:pointer;">🗺 Метки</button>';
        if(isOwner){
            tabs+='<button id="tab-users" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+(adminTab==='users'?'#00bfa5':'#005a52')+';background:'+(adminTab==='users'?'#003a36':'transparent')+';color:'+(adminTab==='users'?'#00bfa5':'#4db6ac')+';font-weight:700;font-size:12px;cursor:pointer;">👥 Пользователи</button>';
        }
        tabs+='</div><div id="admin-content"></div>';
        list.innerHTML=tabs;
        document.getElementById('tab-markers').onclick=function(){adminTab='markers';renderAdmin();};
        if(isOwner)document.getElementById('tab-users').onclick=function(){adminTab='users';renderAdmin();};
        if(adminTab==='markers')renderAdminMarkers();
        else renderAdminUsers();
    }
    function renderAdminMarkers(){
        const content=document.getElementById('admin-content');
        if(!content)return;
        content.innerHTML='';
        if(markersData.length===0){content.innerHTML='<div class="admin-empty">Меток пока нет</div>';return;}
        markersData.forEach(function(m){
            const item=document.createElement('div');item.className='admin-item';
            const t=document.createElement('div');t.innerHTML='<b>'+escapeHtml(m.type)+'</b> — '+escapeHtml(m.city||'—');item.appendChild(t);
            const meta=document.createElement('div');meta.className='meta';meta.textContent=(m.address||'...')+' · '+(m.author||'—');item.appendChild(meta);
            const btn=document.createElement('button');btn.className='del-btn';btn.textContent='Удалить';btn.setAttribute('data-id',m.id);item.appendChild(btn);
            content.appendChild(item);
        });
    }
    async function renderAdminUsers(){
        const content=document.getElementById('admin-content');
        if(!content)return;
        if(currentUser!=='bihepka'){content.innerHTML='<div class="admin-empty">Нет прав</div>';return;}
        content.innerHTML='<div class="admin-empty">Загрузка...</div>';
        const{data:users,error}=await supabaseClient.from('profiles').select('id, username, role, total_markers, is_banned').order('total_markers',{ascending:false});
        if(error){content.innerHTML='<div class="admin-empty">Ошибка: '+error.message+'</div>';return;}
        content.innerHTML='';
        if(!users||users.length===0){content.innerHTML='<div class="admin-empty">Пользователей нет</div>';return;}
        users.forEach(function(u){
            const item=document.createElement('div');
            item.style.cssText='background:#002020;border:1px solid #005a52;border-radius:12px;padding:10px 12px;margin-bottom:8px;'+(u.is_banned?'opacity:.6;border-color:#ff1744;':'');
            const top=document.createElement('div');
            top.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;';
            const name=document.createElement('div');
            name.style.cssText='font-weight:800;color:#b2dfdb;font-size:13px;';
            name.textContent=u.username||'без имени';
            const badge=document.createElement('span');
            let bc='background:#005a52;color:#b2dfdb;';
            let bt='ПОЛЬЗОВАТЕЛЬ';
            if(u.is_banned){bc='background:#ff1744;color:#fff;';bt='ЗАБАНЕН';}
            else if(u.role==='moderator'){bc='background:#00bfa5;color:#001414;';bt='МОДЕРАТОР';}
            else if(u.username==='bihepka'){bc='background:#ffc107;color:#000;';bt='ВЛАДЕЛЕЦ';}
            badge.style.cssText='padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;'+bc;
            badge.textContent=bt;
            top.appendChild(name);top.appendChild(badge);item.appendChild(top);
            const meta=document.createElement('div');
            meta.style.cssText='color:#4db6ac;font-size:11px;margin-bottom:8px;';
            meta.textContent='📊 Меток: '+(u.total_markers||0);
            item.appendChild(meta);
            if(u.username!=='bihepka'){
                const row=document.createElement('div');
                row.style.cssText='display:flex;gap:6px;flex-wrap:wrap;';
                if(!u.is_banned){
                    if(u.role!=='moderator'){
                        const b=document.createElement('button');
                        b.textContent='🛡 Модератор';
                        b.style.cssText='flex:1;padding:8px;background:#00bfa5;color:#001414;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;';
                        b.onclick=function(){setUserRole(u.id,'moderator');};
                        row.appendChild(b);
                    }else{
                        const b=document.createElement('button');
                        b.textContent='❌ Снять права';
                        b.style.cssText='flex:1;padding:8px;background:#ff9800;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;';
                        b.onclick=function(){setUserRole(u.id,'user');};
                        row.appendChild(b);
                    }
                }
                const banBtn=document.createElement('button');
                if(u.is_banned){
                    banBtn.textContent='✅ Разбанить';
                    banBtn.style.cssText='flex:1;padding:8px;background:#00c853;color:#001414;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;';
                    banBtn.onclick=function(){setBan(u.id,false);};
                }else{
                    banBtn.textContent='🚫 Забанить';
                    banBtn.style.cssText='flex:1;padding:8px;background:#ff1744;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;';
                    banBtn.onclick=function(){setBan(u.id,true);};
                }
                row.appendChild(banBtn);
                item.appendChild(row);
            }
            content.appendChild(item);
        });
    }
    async function setUserRole(userId,newRole){
        if(currentUser!=='bihepka'){window.alert('Нет прав');return;}
        const{error}=await supabaseClient.from('profiles').update({role:newRole}).eq('id',userId);
        if(error){window.alert('Ошибка: '+error.message);return;}
        renderAdminUsers();
    }
    async function setBan(userId,ban){
        if(currentUser!=='bihepka'){window.alert('Нет прав');return;}
        const{error}=await supabaseClient.from('profiles').update({is_banned:ban}).eq('id',userId);
        if(error){window.alert('Ошибка: '+error.message);return;}
        renderAdminUsers();
    }
    document.getElementById('admin-list').addEventListener('click',async function(e){
        const isOwner=(currentUser==='bihepka');
        const isModerator=(currentRole==='moderator'||currentRole==='admin');
        if(!isOwner&&!isModerator)return;
        const btn=e.target.closest('.del-btn');if(!btn)return;
        const id=btn.getAttribute('data-id');if(!id)return;
        const reason=window.prompt('Укажите причину удаления метки:');
        if(reason===null)return;
        if(!reason.trim()){window.alert('Причина обязательна!');return;}
        const{error}=await supabaseClient.from('vinera_markers').delete().eq('id',id);
        if(error){window.alert('Не удалось удалить: '+error.message);return;}
        markersData=markersData.filter(m=>String(m.id)!==String(id));
        drawMarkers();updateCityStatus();renderAdmin();
        window.alert('Метка удалена.\nПричина: '+reason);
    });
    
    // Запуск
    checkSession();
    setInterval(function(){pingPresence();},60000);
    setInterval(function(){updateCounters();},30000);
    setInterval(async function(){await loadMarkers();},20000);
    setInterval(async function(){const cutoff=new Date(Date.now()-LIFETIME_MS).toISOString();await supabaseClient.from('vinera_markers').delete().lt('created_at',cutoff);},60000);

}); // Конец checkAccess().then()
}); // Конец window.addEventListener('load')
</script>
