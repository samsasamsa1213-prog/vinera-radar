<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vinera Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --bg: #0f1115; 
    --panel: rgba(22, 26, 32, 0.85); 
    --accent: #10b981; 
    --accent-hover: #059669;
    --accent-soft: rgba(16, 185, 129, 0.15);
    --text: #f3f4f6; 
    --text-muted: #9ca3af;
    --danger: #ef4444; 
    --border: rgba(255, 255, 255, 0.08); 
    --nav-height: 72px; 
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); }

/* Карта */
#map-container { position: absolute; inset: 0; z-index: 1; padding-bottom: var(--nav-height); background: var(--bg); }
#map { width: 100%; height: 100%; background: var(--bg); }
.dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }

/* Экран входа */
#auth-screen { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-box { background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 16px; }
.auth-box h2 { margin: 0 0 8px; color: var(--text); text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
.auth-box input { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.2); color: var(--text); outline: none; font-size: 15px; transition: 0.2s; }
.auth-box input:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.4); }
#auth-btn { padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
#auth-btn:active { transform: scale(0.98); background: var(--accent-hover); }
#auth-toggle { padding: 12px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
#auth-toggle:hover { background: rgba(255,255,255,0.05); }
#auth-error { display: none; color: var(--danger); font-size: 13px; text-align: center; padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; }

/* Онбординг */
#onboarding-screen { position: fixed; inset: 0; z-index: 9998; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
#onboarding-screen.active { display: flex; }
#onboarding-screen h2 { color: var(--text); font-size: 24px; margin-bottom: 12px; font-weight: 700; }
#onboarding-screen p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; max-width: 300px; }
.onboarding-btn { width: 100%; max-width: 300px; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 16px; font-weight: 600; font-size: 16px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
.onboarding-btn:active { transform: scale(0.98); background: var(--accent-hover); }
.onboarding-btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }

/* Основной интерфейс */
#app { display: none; height: 100%; position: relative; }
#map-overlay { position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 16px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
#map-overlay > * { pointer-events: auto; }

/* Верхняя панель */
#top-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
#city-status { flex: 0 1 auto; min-width: 0; padding: 12px 16px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 13px; max-width: 60%; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
#city-status.danger { border-color: rgba(239, 68, 68, 0.4); background: rgba(30, 10, 10, 0.9); }
#city-status .city-name { color: var(--text-muted); font-size: 11px; display: block; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
#city-status .city-state { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Кнопка гео сверху справа */
#geo-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; }
#geo-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
#geo-btn svg { width: 22px; height: 22px; }

/* Уведомления */
#status-toast { position: fixed; top: calc(80px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-10px); padding: 12px 20px; border-radius: 12px; background: #1f2937; border: 1px solid var(--border); color: var(--text); font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 5000; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; white-space: nowrap; }
#status-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#status-toast.error { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

/* Кнопка Сообщить */
#show-markers-btn { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-height) + 24px); z-index: 1000; padding: 14px 28px; border-radius: 30px; background: var(--accent); color: #fff; border: none; box-shadow: 0 8px 25px -5px rgba(16, 185, 129, 0.4); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
#show-markers-btn:active { transform: translateX(-50%) scale(0.95); background: var(--accent-hover); }
#show-markers-btn svg { width: 20px; height: 20px; stroke-width: 2.5; }

/* Шторка */
#markers-sheet-overlay { position: absolute; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: none; opacity: 0; transition: opacity 0.3s; }
#markers-sheet-overlay.active { display: block; opacity: 1; }
#markers-sheet { position: absolute; bottom: var(--nav-height); left: 12px; right: 12px; background: #1a1d24; border: 1px solid var(--border); border-radius: 24px; padding: 24px 20px; transform: translateY(120%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2001; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
#markers-sheet.active { transform: translateY(-12px); }
.sheet-handle { width: 40px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; margin: 0 auto 20px; }
#types-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.marker-btn { width: 76px; height: 76px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-muted); font-weight: 500; font-size: 11px; padding: 0; transition: 0.2s; }
.marker-btn svg { width: 28px; height: 28px; display: block; transition: 0.2s; }
.marker-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.marker-btn.selected svg { transform: scale(1.1); }

/* Маркеры на карте */
.pulse-marker { border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 15px currentColor; animation: pulse 2s infinite ease-in-out; }
.pulse-marker svg { width: 60%; height: 60%; display: block; }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

/* Попапы */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1a1d24; color: var(--text); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.leaflet-popup-content { margin: 16px; }
.popup-title { color: var(--text); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.popup-title svg { width: 20px; height: 20px; }
.popup-muted { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
.popup-muted b { color: var(--text); font-weight: 600; }
.popup-confirm { display: inline-block; margin-top: 12px; padding: 6px 12px; background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-weight: 600; font-size: 12px; }

/* Нижнее меню */
#bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: rgba(15, 17, 21, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); z-index: 9999; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 500; cursor: pointer; flex: 1; height: 100%; transition: 0.2s; }
.nav-btn svg { width: 24px; height: 24px; transition: 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: translateY(-2px); }

/* Лента и остальное */
#feed-screen { position: absolute; inset: 0; bottom: var(--nav-height); background: var(--bg); z-index: 1500; display: none; flex-direction: column; padding: 24px 20px; overflow-y: auto; }
#feed-screen.active { display: flex; }
.feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 10px; }
.feed-header h2 { margin: 0; color: var(--text); font-size: 24px; font-weight: 700; }
.time-filter { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.feed-list { display: flex; flex-direction: column; gap: 12px; }
.feed-item { background: #1a1d24; border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; }
.feed-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.feed-icon svg { width: 22px; height: 22px; }
.feed-content { flex: 1; }
.feed-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: var(--text); }
.feed-meta { font-size: 12px; color: var(--text-muted); }
.feed-empty { text-align: center; color: var(--text-muted); margin-top: 60px; font-size: 15px; }

/* Модалки */
#search-modal-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
#search-modal-overlay.active { display: flex; }
.search-modal { background: #1a1d24; border: 1px solid var(--border); border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
.search-modal h3 { margin: 0; color: var(--text); text-align: center; font-size: 18px; font-weight: 700; }
.search-modal input { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); outline: none; font-size: 15px; }
.search-modal .modal-actions { display: flex; gap: 10px; }
.search-modal button { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
#modal-search-btn { background: var(--accent); color: #fff; }
#modal-cancel-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
</style>
</head>

        <button class="nav-btn" onclick="switchTab('profile')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></button>

</div>

<!-- Модалка профиля юзера в админке -->
<div id="user-profile-modal" style="position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px;">
    <div class="search-modal" style="max-width: 320px;">
        <div style="text-align: center; margin-bottom: 10px;">

        </div>
        
        <div style="background: rgba(0,0,0,0.2); border-radius: 12px; padding: 16px; margin: 16px 0; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border);">

            <button id="modal-user-role-btn" onclick="toggleRoleFromModal()" style="background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.2); padding: 14px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;">Сделать модератором</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('load', function() {
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg && tg.expand) tg.expand();

    window.onTurnstileSuccess = function(token) { window.turnstileToken = token; };

    async function checkAccess() {
        if (!tg || !tg.initData) {
            document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#fff;background:#000a0a;height:100vh;font-family:sans-serif;"><h2 style="color:#00ffcc;margin-top:50px;">Доступ запрещен</h2><p style="margin-top:20px;font-size:16px;">Откройте радар через Telegram-бота <b>@vinera_radar_bot</b></p></div>';
            return false;
        }
        return true;
    }

    checkAccess().then(allowed => {
        if (!allowed) return;

        const SUPABASE_URL = 'https://hpzemwurwkuthcgmtvlw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_H5gZUb84H06cxMb1OfH5Mg_eIWaikbz';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ===== СИСТЕМА УВЕДОМЛЕНИЙ (ТОСТЫ) =====
        let toastTimeout = null;
        window.showToast = function(text, isError = false) {
            const toast = document.getElementById('status-toast');
            if (!toast) return;
            
            toast.innerHTML = text;
            toast.className = isError ? 'show error' : 'show';
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            // Исчезает через 7 секунд
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 7000);
        };

        // ===== КАРТА =====
        const map = L.map('map', { zoomControl: false }).setView([55.7558, 37.6173], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19,
            className: 'dark-tiles'
        }).addTo(map);
        setTimeout(function() { map.invalidateSize(); }, 300);
        setTimeout(function() { map.invalidateSize(); }, 1000);

        // ===== СОСТОЯНИЕ =====
        let currentMarkerType = null; 
        let isPlacingMarker = false;  
        let currentCity = null;
        let userCity = null;
        let markersData = [];
        let feedData = [];
        let currentUser = null;
        let currentRole = 'user';
        let currentBanned = false;
        let currentPhone = null;
        let currentTotalMarkers = 0;
        let isLoggedOut = false;
        let pollInterval = null;
        let cleanupInterval = null;
        let countersInterval = null;

        let recentMarkerTimes = [];
        const MAX_MARKERS = 2;
        const COOLDOWN_MS = 30000;
        const LIFETIME_MS = 900000;
        let userLocationLayer = null;
        let myGeo = null;

        function canPlaceMarker() {
            const now = Date.now();
            recentMarkerTimes = recentMarkerTimes.filter(t => now - t < COOLDOWN_MS);
            if (recentMarkerTimes.length < MAX_MARKERS) return { allowed: true, wait: 0 };
            const oldest = Math.min.apply(null, recentMarkerTimes);
            return { allowed: false, wait: Math.ceil((COOLDOWN_MS - (now - oldest)) / 1000) };
        }

        const METADATA = {
            'БПЛА': { color: '#10b981', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="3"/><path d="M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>' },
            'Ракета': { color: '#ef4444', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c2 3 3 6 3 9v6l-3 3-3-3v-6c0-3 1-6 3-9z"/><path d="M9 14l-3 4M15 14l3 4M12 20v2"/></svg>' },
            'Истребитель': { color: '#3b82f6', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 7h6l-2 3h-4l1 6-3-2-3 2 1-6H6l-2-3h6l2-7z"/></svg>' },
            'Сирена': { color: '#8b5cf6', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 0 1 16 0v4H4v-4z"/><path d="M12 2v2M3 8l2 2M21 8l-2 2M2 14h2M20 14h2M8 18v2M16 18v2"/></svg>' },
            'Взрыв': { color: '#f59e0b', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></svg>' },
            'Тихо': { color: '#10b981', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>' }
        };
        const dangerTypes = ['Взрыв', 'Сирена', 'Ракета'];
        const layerGroup = L.layerGroup().addTo(map);
        const markerRefs = {};

        // ===== AUTH UI =====
        const authScreen = document.getElementById('auth-screen');
        const authLogin = document.getElementById('auth-login');
        const authPassword = document.getElementById('auth-password');
        const authBtn = document.getElementById('auth-btn');
        const authToggle = document.getElementById('auth-toggle');
        const authTitle = document.getElementById('auth-title');
        const authError = document.getElementById('auth-error');
        let isRegisterMode = false;

        function showAuthError(msg) { authError.textContent = msg; authError.style.display = 'block'; }

        authToggle.addEventListener('click', function() {
            isRegisterMode = !isRegisterMode;
            authTitle.textContent = isRegisterMode ? 'Регистрация' : 'Вход в Vinera';
            authBtn.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            authToggle.textContent = isRegisterMode ? 'У меня уже есть аккаунт' : 'Создать аккаунт';
            authError.style.display = 'none';
        });

        async function handleAuth() {
            const login = authLogin.value.trim().toLowerCase();
            const password = authPassword.value;
            if (!login || !password) { showAuthError('Введите логин и пароль'); return; }
            if (login.length < 3) { showAuthError('Логин не короче 3 символов'); return; }
            if (password.length < 6) { showAuthError('Пароль не короче 6 символов'); return; }

            authBtn.disabled = true;
            authBtn.textContent = 'Подождите...';
            authError.style.display = 'none';
            const email = login + '@vinera.app';

            try {
                if (isRegisterMode) {
                    const tgUser = tg ? tg.initDataUnsafe?.user : null;
                    if (tgUser) {
                        const { data: reg } = await supabaseClient.from('registrations').select('count').eq('telegram_id', tgUser.id).maybeSingle();
                        const currentCount = reg ? reg.count : 0;
                        if (currentCount >= 3) throw new Error('Лимит аккаунтов исчерпан!');
                        await supabaseClient.from('registrations').upsert({ telegram_id: tgUser.id, count: currentCount + 1 });
                    }
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email, password: password,
                        options: { captchaToken: window.turnstileToken }
                    });
                    if (error) throw error;
                    if (data.user) {
                        await supabaseClient.from('profiles').insert({
                            id: data.user.id, username: login, role: 'user', total_markers: 0, is_banned: false,
                            telegram_id: tgUser ? tgUser.id : null
                        });
                    }
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
                    if (error) throw error;
                }
                await checkSession();
            } catch (e) {
                showAuthError(e.message || 'Ошибка входа');
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            }
        }

        authBtn.addEventListener('click', handleAuth);
        authPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleAuth(); });

        async function updateCounters() {
            if (isLoggedOut) return;
            try {
                const fiveMinAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
                const { count: online } = await supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).gt('last_seen_at', fiveMinAgo);
                const o = document.getElementById('online-count');
                if (o && online !== null) o.textContent = online;
            } catch (e) {}
        }
                // ===== СЕССИЯ =====
        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.session.user.id).maybeSingle();

                currentUser = profile ? profile.username : 'user';
                currentRole = (profile && profile.role) ? profile.role : 'user';
                currentBanned = (profile && profile.is_banned) ? true : false;
                currentPhone = (profile && profile.phone) ? profile.phone : null;
                currentTotalMarkers = (profile && profile.total_markers) ? profile.total_markers : 0;

                // ФИКС АДМИНКИ: жестко привязываем к твоим никам
                if (currentUser === 'bihepka' || currentUser === 'VineraRadarr' || currentUser === 'Hollisheetq') { 
                    currentRole = 'admin'; 
                    currentBanned = false; 
                }

                if (currentBanned) {
                    await supabaseClient.auth.signOut();
                    authScreen.style.display = 'none';
                    document.getElementById('app').style.display = 'none';
                    document.body.innerHTML = '<div style="padding:20px;text-align:center;color:#fff;background:#0f1115;height:100vh;padding-top:50px;"><h2 style="color:#ef4444;">Аккаунт заблокирован</h2><p style="margin-top:10px;color:#9ca3af;">По вопросам: <b>@VineraRadarr</b></p></div>';
                    return;
                }

                document.getElementById('profile-name').textContent = currentUser;
                document.getElementById('profile-avatar-letter').textContent = currentUser.charAt(0).toUpperCase();
                document.getElementById('profile-stat-markers').textContent = currentTotalMarkers;

                let roleText = 'ПОЛЬЗОВАТЕЛЬ';
                if (currentRole === 'admin') roleText = 'АДМИНИСТРАТОР';
                else if (currentRole === 'moderator') roleText = 'МОДЕРАТОР';

                document.getElementById('profile-role-badge').textContent = roleText;
                document.getElementById('profile-stat-role').textContent = currentRole;

                if (currentRole === 'admin' || currentRole === 'moderator') {
                    document.getElementById('admin-toggle-btn').style.display = 'flex';
                }

                authScreen.style.display = 'none';
                document.getElementById('app').style.display = 'block';
                setTimeout(function() { map.invalidateSize(); }, 200);

                const savedCity = localStorage.getItem('vinera_city');
                const savedGeo = localStorage.getItem('vinera_geo');

                if (!savedCity && currentUser !== 'bihepka') {
                    document.getElementById('onboarding-screen').classList.add('active');
                    document.getElementById('app').style.display = 'none';
                } else {
                    userCity = savedCity;
                    currentCity = savedCity; 
                    
                    showToast('Метки загружены');

                    if (savedGeo) {
                        try {
                            const g = JSON.parse(savedGeo);
                            myGeo = { lat: g.lat, lon: g.lon };
                            map.setView([g.lat, g.lon], 13);
                            showUserLocation(g.lat, g.lon);
                        } catch (e) {}
                    }

                    if (navigator.geolocation && !myGeo) {
                        navigator.geolocation.getCurrentPosition((pos) => {
                            myGeo = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                            localStorage.setItem('vinera_geo', JSON.stringify({ lat: myGeo.lat, lon: myGeo.lon }));
                            showUserLocation(myGeo.lat, myGeo.lon);
                            map.setView([myGeo.lat, myGeo.lon], 13);
                        }, function() {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
                    }

                    updateCityStatus();
                    await loadMarkers();
                    await updateCounters();
                }
            } else {
                authScreen.style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        }

        window.logout = async function() {
            isLoggedOut = true;
            if (pollInterval) clearInterval(pollInterval);
            if (cleanupInterval) clearInterval(cleanupInterval);
            if (countersInterval) clearInterval(countersInterval);
            await supabaseClient.auth.signOut();
            localStorage.removeItem('vinera_city');
            localStorage.removeItem('vinera_geo');
            currentUser = null; currentRole = 'user'; currentBanned = false; currentPhone = null;
            userCity = null; markersData = []; feedData = []; recentMarkerTimes = [];
            myGeo = null; isPlacingMarker = false;
            document.getElementById('geo-btn').classList.remove('active');
            drawMarkers();

        // ===== ИКОНКИ И ПОПАПЫ =====
        function makeIcon(type) {
            const meta = METADATA[type] || METADATA['БПЛА'];
            return L.divIcon({
                className: '',
                html: '<div class="pulse-marker" style="width:22px;height:22px;background:' + meta.color + ';color:' + meta.color + ';">' + meta.svg + '</div>',
                iconSize: [22, 22], iconAnchor: [11, 11]
            });
        }
        function isConfirmed(m) {
            return markersData.some(o => o.id !== m.id && o.type === m.type && map.distance([o.lat, o.lng], [m.lat, m.lng]) <= 300);
        }
        function popupHtml(m) {
            const meta = METADATA[m.type] || METADATA['БПЛА'];
            const confirmed = isConfirmed(m);
            return '<div class="popup-title">' + meta.svg + ' ' + escapeHtml(m.type) + '</div>' +
                '<div class="popup-muted">Поставил: <b>' + escapeHtml(m.author) + '</b></div>' +
                '<div class="popup-muted">Район: ' + escapeHtml(m.address || 'определяется...') + '</div>' +
                '<div class="popup-muted">Город: ' + escapeHtml(m.city || 'Неизвестно') + '</div>' +
                '<div class="popup-muted">' + new Date(m.created_at).toLocaleString('ru-RU') + '</div>' +
                (confirmed ? '<div class="popup-confirm">✔ Подтверждено</div>' : '');
        }

        function drawMarkers() {
            layerGroup.clearLayers();
            Object.keys(markerRefs).forEach(k => delete markerRefs[k]);
            const currentZoom = map.getZoom();
            if (currentZoom < 10) return;

            markersData.forEach(m => {
                const marker = L.marker([m.lat, m.lng], { icon: makeIcon(m.type) }).addTo(layerGroup);
                marker.bindPopup(popupHtml(m));
                markerRefs[m.id] = marker;
            });
        }

        map.on('zoomend', function() { drawMarkers(); });

        // ===== ЗАГРУЗКА МЕТОК =====
        async function loadMarkers() {
            if (isLoggedOut) return;
            const { data, error } = await supabaseClient.from('vinera_markers').select('*').order('created_at', { ascending: false });
            if (error) { showToast('Ошибка: ' + error.message, true); return; }

            const now = Date.now();
            markersData = (data || []).filter(m => {
                const isFresh = (now - new Date(m.created_at).getTime()) < LIFETIME_MS;
                const isMyCity = !userCity || (m.city && m.city.toLowerCase().includes(userCity.toLowerCase()));
                const justPlaced = (now - new Date(m.created_at).getTime()) < 10000;
                return isFresh && (isMyCity || justPlaced);
            });

            const oneDayAgo = now - (24 * 60 * 60 * 1000);
            feedData = (data || []).filter(m => new Date(m.created_at).getTime() > oneDayAgo);

            drawMarkers();
            updateCityStatus();
            renderFeed();
        }

        function renderFeed() {
            const list = document.getElementById('feed-list');
            list.innerHTML = '';
            if (feedData.length === 0) {
                list.innerHTML = '<div class="feed-empty">За последние 24 часа событий не было</div>';
                return;
            }
            feedData.forEach(m => {
                const meta = METADATA[m.type] || METADATA['БПЛА'];
                const item = document.createElement('div');
                item.className = 'feed-item';
                const time = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                item.innerHTML =
                    '<div class="feed-icon" style="background:' + meta.color + '15; border: 1px solid ' + meta.color + '40;">' + meta.svg.replace('stroke="#fff"', 'stroke="' + meta.color + '"') + '</div>' +
                    '<div class="feed-content">' +
                    '<div class="feed-title">' + escapeHtml(m.type) + ' — ' + escapeHtml(m.city || 'Неизвестно') + '</div>' +
                    '<div class="feed-meta">' + time + ' · ' + escapeHtml(m.author || 'Аноним') + '</div>' +
                    '</div>';
                list.appendChild(item);
            });
        }

        async function resolveAddress(m) {
            try {
                const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + m.lat + '&lon=' + m.lng + '&zoom=14&accept-language=ru';
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const data = await res.json();
                const a = data.address || {};
                const parts = [a.city || a.town || a.village || a.county, a.suburb || a.neighbourhood || a.road];
                const address = parts.filter(Boolean).join(', ') || (data.display_name || 'неизвестно');
                await supabaseClient.from('vinera_markers').update({ address: address }).eq('id', m.id);
                m.address = address;
                if (markerRefs[m.id]) markerRefs[m.id].setPopupContent(popupHtml(m));
            } catch (e) {}
        }

        function pluralizeStatus(types) {
            const threats = types.filter(t => t !== 'Тихо');
            if (threats.length === 0) return { text: types.length === 0 ? '—' : 'Тихо', danger: false };
            const counts = {};
            threats.forEach(t => counts[t] = (counts[t] || 0) + 1);
            const unique = Object.keys(counts);
            const hasDanger = unique.some(t => dangerTypes.includes(t));
            const pm = { 'Взрыв': 'Взрывы', 'Сирена': 'Сирены', 'Ракета': 'Ракеты', 'БПЛА': 'БПЛА', 'Истребитель': 'Истребители' };
            const labels = unique.map(t => counts[t] > 1 ? (pm[t] || t) : t);
            return { text: '⚠ ' + labels.join(' · '), danger: hasDanger };
        }

        function updateCityStatus() {
            const box = document.getElementById('city-status');
            const nameEl = box.querySelector('.city-name');
            const stateEl = box.querySelector('.city-state');
            nameEl.textContent = (currentCity || 'Город не выбран').toUpperCase();
            if (!currentCity) { stateEl.textContent = '—'; box.classList.remove('danger'); return; }
            const types = markersData.filter(m => m.city === currentCity).map(m => m.type);
            const res = pluralizeStatus(types);
            stateEl.textContent = res.text;
            box.classList.toggle('danger', res.danger);
        }
                function showUserLocation(lat, lon) {
            if (userLocationLayer) map.removeLayer(userLocationLayer);
            userLocationLayer = L.layerGroup().addTo(map);
            L.circle([lat, lon], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.2, radius: 200, weight: 1 }).addTo(userLocationLayer);
            L.circleMarker([lat, lon], { radius: 6, fillColor: '#10b981', color: '#fff', weight: 2, opacity: 1, fillOpacity: 1 }).addTo(userLocationLayer).bindPopup('Вы здесь');
        }

        window.backToGeo = function() {
            if (!myGeo) { showToast('Ваше гео не определено', true); return; }
            map.setView([myGeo.lat, myGeo.lon], 13);
            showToast('Вы вернулись на своё гео');
        };

        // ===== МОДАЛКА ПОИСКА ГОРОДА =====
        window.openSearchModal = function() {
            document.getElementById('search-modal-overlay').classList.add('active');
            document.getElementById('modal-city-input').value = userCity || '';
        };

        window.closeSearchModal = function() {
            document.getElementById('search-modal-overlay').classList.remove('active');
        };

        window.searchCityFromModal = async function() {
            const city = document.getElementById('modal-city-input').value.trim();
            if (!city) return;
            showToast('Поиск...');
            try {
                const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(city) + '&limit=1&accept-language=ru');
                const data = await res.json();
                if (data && data.length > 0) {
                    map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 12);
                    showToast('Найден: ' + data[0].display_name.split(',')[0].trim());
                    currentCity = data[0].display_name.split(',')[0].trim();
                    userCity = currentCity;
                    localStorage.setItem('vinera_city', userCity);
                    updateCityStatus();
                    closeSearchModal();
                    await loadMarkers();
                } else {
                    showToast('Город не найден', true);
                }
            } catch (e) {
                showToast('Ошибка поиска', true);
            }
        };

        // ===== ГЕОЛОКАЦИЯ =====
        window.requestGeoLocation = function() {
            if (!navigator.geolocation) { alert('Геолокация не поддерживается'); return; }
            document.getElementById('onboarding-screen').innerHTML = '<h2>Ищем вас...</h2><p>Пожалуйста, подождите</p>';
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    myGeo = { lat: lat, lon: lon };
                    localStorage.setItem('vinera_geo', JSON.stringify({ lat: lat, lon: lon }));
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=ru`);
                        const data = await res.json();
                        const addr = data.address || {};
                        
                        // ФИКС: Убрали "state", чтобы не кидало в Москву. Берем только город/поселок/деревню.
                        let city = addr.city || addr.town || addr.village || addr.municipality || addr.county || 'Ваш город';
                        
                        userCity = city;
                        currentCity = city;
                        localStorage.setItem('vinera_city', city);
                        
                        showToast('Город определен: ' + city);
                        
                        map.setView([lat, lon], 13);
                        showUserLocation(lat, lon);
                        document.getElementById('onboarding-screen').classList.remove('active');
                        document.getElementById('app').style.display = 'block';
                        setTimeout(function() { map.invalidateSize(); }, 200);
                        updateCityStatus();
                        await loadMarkers();
                    } catch (e) {
                        alert('Не удалось определить город. Выберите его вручную.');
                        showManualCitySearch();
                    }
                },
                (error) => {
                    alert('Вы отклонили геолокацию. Придется выбрать город вручную.');
                    showManualCitySearch();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        };

            document.getElementById('onboarding-screen').classList.remove('active');
            document.getElementById('app').style.display = 'block';
            setTimeout(() => map.invalidateSize(), 200);
            openSearchModal();
            showToast('Выберите город в поиске');

        // ===== РЕЖИМ УСТАНОВКИ МЕТКИ =====
        window.toggleMarkersSheet = function() {
            const sheet = document.getElementById('markers-sheet');
            const overlay = document.getElementById('markers-sheet-overlay');

                sheet.classList.remove('active');
                overlay.classList.remove('active');

                sheet.classList.add('active');
                overlay.classList.add('active');
            }
        };

        window.setMarkerType = function(type, btn) {
            if (isPlacingMarker && currentMarkerType === type) {
                isPlacingMarker = false;
                currentMarkerType = null;
                document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('selected'));
                showToast('Режим установки отменен');
            } else {
                isPlacingMarker = true;
                currentMarkerType = type;
                document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('selected'));
                if (btn) btn.classList.add('selected');
                showToast('Тапните по карте, чтобы поставить: ' + type);
            }
            toggleMarkersSheet();
        };

        // ===== КЛИК ПО КАРТЕ =====
        map.on('click', async function(e) {
            if (!isPlacingMarker || !currentMarkerType) return;

            if (currentUser !== 'bihepka' && currentUser !== 'VineraRadarr' && currentUser !== 'Hollisheetq') {
                if (!currentPhone) {
                    showToast('⚠ Подтвердите номер в боте!', true);
                    return;
                }
            }

            if (!currentCity) { 
                showToast('Сначала выберите город в профиле!', true);
                return; 
            }

            const cd = canPlaceMarker();
            if (!cd.allowed) {
                showToast('⏳ Подождите ' + cd.wait + ' сек.', true);
                return;
            }

            showToast('Сохранение...');
            
            let clickedCity = currentCity;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}&zoom=12&accept-language=ru`);
                const data = await res.json();
                const addr = data.address || {};
                clickedCity = addr.city || addr.town || addr.village || addr.hamlet || currentCity;
            } catch(err) {}

            const m = { type: currentMarkerType, lat: e.latlng.lat, lng: e.latlng.lng, city: clickedCity, author: currentUser || 'Аноним', address: 'определяется...' };
            const { data, error } = await supabaseClient.from('vinera_markers').insert([m]).select().single();
            
            if (error) { 
                showToast('Ошибка: ' + error.message, true); 
                return; 
            }

            // Счетчик
            currentTotalMarkers += 1;
            document.getElementById('profile-stat-markers').textContent = currentTotalMarkers;
            await supabaseClient.from('profiles').update({ total_markers: currentTotalMarkers }).eq('username', currentUser);

            recentMarkerTimes.push(Date.now());
            markersData.unshift(data);
            drawMarkers();
            updateCityStatus();
            resolveAddress(data);
            
            isPlacingMarker = false;
            currentMarkerType = null;
            document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('selected'));
            showToast('Метка поставлена ✔');
        });

        document.getElementById('clear-all-btn').onclick = async function() {
            if (!window.confirm('Удалить ВСЕ метки?')) return;
            this.textContent = 'Очистка...';

        async function renderAdmin() {
            const content = document.getElementById('admin-content');
            if (!content) return;
            content.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 20px;">Загрузка...</div>';

            if (adminTab === 'markers') {
                if (markersData.length === 0) { content.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 20px;">Активных меток нет</div>'; return; }
                content.innerHTML = '';
                markersData.forEach(m => {
                    const item = document.createElement('div');
                    item.style.background = '#1a1d24'; item.style.border = '1px solid var(--border)'; item.style.borderRadius = '12px'; item.style.padding = '16px'; item.style.fontSize = '14px';
                    item.innerHTML =
                        '<b>' + escapeHtml(m.type) + '</b> — ' + escapeHtml(m.city || '—') +
                        '<div style="color:var(--text-muted); font-size:12px; margin-top:6px;">' + escapeHtml(m.address || '...') + ' · ' + escapeHtml(m.author || '—') + '</div>' +
                        '<button onclick="deleteMarker(\'' + m.id + '\')" style="margin-top:12px; padding:10px; background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid rgba(239,68,68,0.2); border-radius:8px; font-weight:600; font-size:13px; width:100%; cursor:pointer;">Удалить</button>';
                    content.appendChild(item);
                });
            } else if (adminTab === 'users') {
                const { data: users, error } = await supabaseClient.from('profiles').select('*').order('total_markers', { ascending: false });
                if (error) { content.innerHTML = '<div style="color:var(--danger)">Ошибка: ' + escapeHtml(error.message) + '</div>'; return; }
                if (!users || users.length === 0) { content.innerHTML = '<div style="color:var(--text-muted)">Нет пользователей</div>'; return; }
                content.innerHTML = '';
                users.forEach(u => {
                    if (u.username === 'bihepka' || u.username === 'VineraRadarr' || u.username === 'Hollisheetq') return;
                    const item = document.createElement('div');
                    item.style.background = '#1a1d24'; item.style.border = '1px solid var(--border)'; item.style.borderRadius = '12px'; item.style.padding = '16px'; item.style.cursor = 'pointer';
                    item.style.opacity = u.is_banned ? '0.6' : '1';
                    item.onclick = () => openUserProfileModal(u);
                    
                    const badge = u.is_banned ? '<span style="color:var(--danger);font-size:10px; border: 1px solid var(--danger); padding: 2px 6px; border-radius: 6px; margin-left: 8px;">[БАН]</span>' : '';
                    item.innerHTML =
                        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                            '<b>' + escapeHtml(u.username || 'без имени') + '</b>' + badge +
                        '</div>' +
                        '<div style="color:var(--text-muted); font-size:12px; margin-top:6px;">Меток: ' + (u.total_markers || 0) + ' · Роль: ' + escapeHtml(u.role || 'user') + '</div>' +
                        '<div style="font-size: 11px; color: #666; margin-top: 8px; text-align: right;">Нажмите для управления →</div>';
                    content.appendChild(item);
                });
            }
        }

        window.deleteMarker = async function(id) {
            const reason = window.prompt('Причина удаления:');
            if (reason === null) return;
            if (!reason.trim()) { window.alert('Причина обязательна!'); return; }
            const { error } = await supabaseClient.from('vinera_markers').delete().eq('id', id);
            if (error) { showToast('Ошибка: ' + error.message, true); return; }
            markersData = markersData.filter(m => String(m.id) !== String(id));
            feedData = feedData.filter(m => String(m.id) !== String(id));
            drawMarkers(); updateCityStatus(); renderFeed(); renderAdmin();
            showToast('Метка удалена');
        };

        // ===== МОДАЛКА ПРОФИЛЯ ЮЗЕРА =====
        let selectedUserId = null;
        let selectedUserData = null;

        window.openUserProfileModal = function(u) {
            selectedUserId = u.id;
            selectedUserData = u;

            document.getElementById('modal-user-avatar').textContent = (u.username || 'U').charAt(0).toUpperCase();
            document.getElementById('modal-user-name').textContent = u.username || 'Без имени';
            
            let roleText = 'ПОЛЬЗОВАТЕЛЬ';
            if (u.role === 'admin') roleText = 'АДМИНИСТРАТОР';
            else if (u.role === 'moderator') roleText = 'МОДЕРАТОР';
            document.getElementById('modal-user-role').textContent = roleText;

            document.getElementById('modal-user-markers').textContent = u.total_markers || 0;
            document.getElementById('modal-user-tg').textContent = u.telegram_id || 'Нет';

            const banBtn = document.getElementById('modal-user-ban-btn');
            if (u.is_banned) {
                banBtn.textContent = 'Разбанить';
                banBtn.style.color = '#10b981';
                banBtn.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                banBtn.style.background = 'rgba(16, 185, 129, 0.1)';
            } else {
                banBtn.textContent = 'Забанить';
                banBtn.style.color = 'var(--danger)';
                banBtn.style.borderColor = 'rgba(239, 68, 68, 0.2)';
                banBtn.style.background = 'rgba(239, 68, 68, 0.1)';
            }

            const roleBtn = document.getElementById('modal-user-role-btn');
            if (u.role === 'moderator') {
                roleBtn.textContent = 'Снять модератора';
                roleBtn.style.color = '#f59e0b';
                roleBtn.style.borderColor = 'rgba(245, 158, 11, 0.2)';
                roleBtn.style.background = 'rgba(245, 158, 11, 0.1)';
            } else {
                roleBtn.textContent = 'Сделать модератором';
                roleBtn.style.color = 'var(--accent)';
                roleBtn.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                roleBtn.style.background = 'rgba(16, 185, 129, 0.1)';
            }

            document.getElementById('user-profile-modal').style.display = 'flex';
        };

        window.closeUserProfileModal = function() {
            document.getElementById('user-profile-modal').style.display = 'none';
            selectedUserId = null;
            selectedUserData = null;
        };

        window.toggleBanFromModal = async function() {
            if (!selectedUserId || !selectedUserData) return;
            const newBanStatus = !selectedUserData.is_banned;
            const { error } = await supabaseClient.from('profiles').update({ is_banned: newBanStatus }).eq('id', selectedUserId);
            if (error) { showToast('Ошибка: ' + error.message, true); return; }
            showToast(newBanStatus ? 'Пользователь забанен' : 'Пользователь разбанен');
            closeUserProfileModal();
            renderAdmin();
        };

        window.toggleRoleFromModal = async function() {
            if (!selectedUserId || !selectedUserData) return;
            const newRole = selectedUserData.role === 'moderator' ? 'user' : 'moderator';
            const { error } = await supabaseClient.from('profiles').update({ role: newRole }).eq('id', selectedUserId);
            if (error) { showToast('Ошибка: ' + error.message, true); return; }
            showToast(newRole === 'moderator' ? 'Выдан статус модератора' : 'Статус снят');
            closeUserProfileModal();
            renderAdmin();
        };

        // ===== ЗАПУСК И ИНТЕРВАЛЫ =====
        checkSession();

        pollInterval = setInterval(function() {
            if (!isLoggedOut) loadMarkers();
        }, 45000);

        cleanupInterval = setInterval(async function() {
            if (isLoggedOut) return;
            const cutoff = new Date(Date.now() - LIFETIME_MS).toISOString();
            await supabaseClient.from('vinera_markers').delete().lt('created_at', cutoff);
            await loadMarkers();
        }, 120000);

        countersInterval = setInterval(function() { updateCounters(); }, 60000);
    });
});
</script>
</body>
</html>
