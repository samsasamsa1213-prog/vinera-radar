<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vinera Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #001414;
            --panel: rgba(0, 26, 26, 0.95);
            --accent: #00bfa5;
            --accent-soft: #4db6ac;
            --text: #b2dfdb;
            --danger: #ff1744;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); overflow: hidden; color: var(--text);
        }
        #map { position: absolute; inset: 0; z-index: 1; background: var(--bg); }
        .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.1) saturate(0.5); }

        #controls {
            position: absolute;
            top: calc(8px + env(safe-area-inset-top));
            left: 8px; right: 8px;
            z-index: 1000;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: none;
        }
        #controls > * { pointer-events: auto; }

        #top-row {
            display: flex; gap: 6px; align-items: flex-start;
            justify-content: space-between;
        }
        #city-status {
            flex: 0 1 auto; min-width: 0;
            padding: 7px 10px; border-radius: 10px;
            background: var(--panel); border: 2px solid var(--accent);
            color: var(--text); font-weight: 700; font-size: 12px;
            box-shadow: 0 0 14px rgba(0,191,165,0.45);
            animation: statusPulse 1.6s infinite ease-in-out;
            transition: border-color .3s, box-shadow .3s;
            max-width: 55%; overflow: hidden;
        }
        #city-status.danger {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255,23,68,0.8);
            animation: dangerPulse 1s infinite ease-in-out;
        }
        @keyframes statusPulse {
            0%,100% { box-shadow: 0 0 8px rgba(0,191,165,0.35); }
            50%     { box-shadow: 0 0 18px rgba(0,191,165,0.85); }
        }
        @keyframes dangerPulse {
            0%,100% { box-shadow: 0 0 10px rgba(255,23,68,0.5); }
            50%     { box-shadow: 0 0 24px rgba(255,23,68,1); }
        }
        #city-status .city-name {
            color: var(--accent); font-size: 9.5px; display: block;
            letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #city-status.danger .city-name { color: #ff8a9b; }
        #city-status .city-state {
            font-size: 13px; display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #city-status.danger .city-state { color: #ff5252; }

        #site-title {
            color: var(--accent); font-weight: 800;
            font-size: 13px; letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0,191,165,0.6);
            padding-top: 6px; white-space: nowrap;
        }

        #search-box { display: flex; gap: 5px; }
        #city-input {
            flex: 1; padding: 9px 10px; border-radius: 9px;
            border: 1px solid var(--accent); background: #002020;
            color: var(--text); outline: none; font-size: 14px; min-width: 0;
        }
        #city-input::placeholder { color: #3d8f88; }
        #search-btn {
            padding: 9px 14px; background: var(--accent); color: #001414;
            border: none; border-radius: 9px; cursor: pointer; font-weight: 800;
            font-size: 13px; white-space: nowrap;
        }

        #types-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .marker-btn {
            width: 52px; height: 52px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1px;
            color: #fff; font-weight: 700; font-size: 9.5px;
            transition: transform .12s, box-shadow .2s, border-color .2s;
            padding: 0; line-height: 1.05; text-align: center;
        }
        .marker-btn .ico { font-size: 17px; line-height: 1; }
        .marker-btn:active { transform: scale(.9); }
        .marker-btn.selected { border-color: #fff; box-shadow: 0 0 0 2px #fff, 0 0 14px rgba(255,255,255,0.7); }
        .btn-drone     { background: #ff9800; }
        .btn-missile   { background: #f44336; }
        .btn-jet       { background: #2196f3; }
        .btn-siren     { background: #9c27b0; }
        .btn-explosion { background: #ffc107; color: #000; }
        .btn-quiet     { background: #00c853; }

        #status {
            font-size: 10.5px; color: var(--accent-soft);
            text-align: center; padding: 2px 6px;
            background: rgba(0,26,26,0.7); border-radius: 8px;
        }

        .pulse-marker {
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.95);
            box-shadow: 0 0 10px currentColor;
            animation: pulse 1.2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%   { transform: scale(1); opacity: 1; }
            50%  { transform: scale(1.5); opacity: .55; }
            100% { transform: scale(1); opacity: 1; }
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #002626; color: var(--text);
            border: 1px solid var(--accent); border-radius: 10px;
        }
        .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.45; }
        .popup-confirm {
            display: inline-block; margin-top: 6px; padding: 3px 8px;
            background: #00c853; color: #001414; border-radius: 6px;
            font-weight: 800; font-size: 11px;
        }
        .popup-title { color: var(--accent); font-weight: 800; font-size: 14px; }
        .popup-muted { color: var(--accent-soft); font-size: 11.5px; }

        #menu-btn {
            position: absolute; bottom: calc(14px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            z-index: 1000; padding: 11px 28px;
            background: var(--accent); color: #001414;
            border: none; border-radius: 24px;
            font-weight: 800; font-size: 14px;
            cursor: pointer; box-shadow: 0 0 18px rgba(0,191,165,0.7);
        }
        #menu-btn:active { transform: translateX(-50%) scale(.95); }

        #menu-panel {
            position: absolute; bottom: calc(64px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            z-index: 1100; background: var(--panel);
            border: 2px solid var(--accent); border-radius: 16px;
            padding: 14px; display: none;
            box-shadow: 0 0 26px rgba(0,191,165,0.6);
            width: 92%; max-width: 400px; max-height: 68vh; overflow-y: auto;
        }
        #menu-panel.open { display: block; }
        #menu-panel h3 { margin: 0 0 10px; color: var(--accent); font-size: 15px; text-align: center; letter-spacing: 1px; }
        .owner-link {
            display: block; padding: 11px; background: #002626;
            border: 1px solid var(--accent); border-radius: 10px;
            color: var(--text); text-decoration: none; font-weight: 700;
            text-align: center; font-size: 13px;
        }
        .owner-link:active { background: #004040; }
        .menu-close {
            display: block; width: 100%; margin-top: 12px; padding: 9px;
            background: #f44336; color: #fff; border: none; border-radius: 10px;
            cursor: pointer; font-weight: 800; font-size: 13px;
        }
        #admin-toggle {
            display: block; width: 100%; margin-top: 12px; padding: 10px;
            background: transparent; border: 1px dashed var(--accent);
            color: var(--accent); border-radius: 10px; cursor: pointer;
            font-weight: 700; font-size: 13px;
        }
        #admin-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .admin-item {
            background: #002020; border: 1px solid #005a52; border-radius: 10px;
            padding: 9px 10px; font-size: 12px;
        }
        .admin-item .meta { color: var(--accent-soft); font-size: 10.5px; margin-top: 2px; }
        .admin-item .del-btn {
            margin-top: 6px; padding: 6px 12px; background: var(--danger); color: #fff;
            border: none; border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 11.5px;
        }
        .admin-empty { color: var(--accent-soft); font-size: 12px; text-align: center; padding: 8px; }

        @media (max-width: 360px) {
            .marker-btn { width: 46px; height: 46px; font-size: 8.5px; }
            .marker-btn .ico { font-size: 15px; }
        }
    </style>
</head>
<body>

<div id="controls">
    <div id="top-row">
        <div id="city-status">
            <span class="city-name">ГОРОД НЕ ВЫБРАН</span>
            <span class="city-state">—</span>
        </div>
        <div id="site-title">VINERA RADAR</div>
    </div>

    <div id="search-box">
        <input type="text" id="city-input" placeholder="Введите город">
        <button id="search-btn" onclick="searchCity()">Найти</button>
    </div>

    <div id="types-row">
        <button class="marker-btn btn-drone"     onclick="setMarkerType('БПЛА', this)"><span class="ico">🛸</span>БПЛА</button>
        <button class="marker-btn btn-missile"   onclick="setMarkerType('Ракета', this)"><span class="ico">🚀</span>Ракета</button>
        <button class="marker-btn btn-jet"       onclick="setMarkerType('Истребитель', this)"><span class="ico">✈️</span>Истребитель</button>
        <button class="marker-btn btn-siren"     onclick="setMarkerType('Сирена', this)"><span class="ico">📢</span>Сирена</button>
        <button class="marker-btn btn-explosion" onclick="setMarkerType('Взрыв', this)"><span class="ico">💥</span>Взрыв</button>
        <button class="marker-btn btn-quiet"     onclick="setMarkerType('Тихо', this)"><span class="ico">🟢</span>Тихо</button>
    </div>

    <div id="status">Выберите тип метки и кликните на карту</div>
</div>

<div id="map"></div>

<button id="menu-btn" onclick="toggleMenu()">☰ Меню</button>

<div id="menu-panel">
    <h3>МЕНЮ</h3>
    <a class="owner-link" href="https://t.me/Hollisheetq" target="_blank" rel="noopener">
        Связь с владельцем<br>Telegram: @Hollisheetq
    </a>

    <button id="admin-toggle" onclick="toggleAdmin()">🛠 Админ-панель</button>
    <div id="admin-list"></div>

    <button class="menu-close" onclick="toggleMenu()">Закрыть</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
window.addEventListener('load', async function () {
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg && tg.expand) tg.expand();

    const userLabel = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
        ? ('@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name))
        : 'Пользователь';

    const ADMIN_IDS = [8726139706];
    const currentUserId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
        ? tg.initDataUnsafe.user.id
        : null;
    const isAdmin = currentUserId !== null && ADMIN_IDS.includes(currentUserId);

    const adminToggleBtn = document.getElementById('admin-toggle');
    if (adminToggleBtn && !isAdmin) adminToggleBtn.style.display = 'none';

    const SUPABASE_URL = 'https://jckoziwygfslfsrqnqva.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Gg3LEIO-hequGbxdxzu4IQ_02MRg3t3';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const map = L.map('map', { zoomControl: false }).setView([55.7558, 37.6173], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19, className: 'dark-tiles'
    }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    let currentMarkerType = 'БПЛА';
    let currentCity = null;
    let markersData = [];

    const typeColors = {
        'БПЛА': '#ff9800', 'Ракета': '#f44336', 'Истребитель': '#2196f3',
        'Сирена': '#9c27b0', 'Взрыв': '#ffc107', 'Тихо': '#00c853'
    };
    const typeIcons = {
        'БПЛА': '🛸', 'Ракета': '🚀', 'Истребитель': '✈️',
        'Сирена': '📢', 'Взрыв': '💥', 'Тихо': '🟢'
    };
    const dangerTypes = ['Взрыв', 'Сирена', 'Ракета'];

    const layerGroup = L.layerGroup().addTo(map);
    const markerRefs = {};

    function makeIcon(type) {
        const color = typeColors[type] || '#00bfa5';
        return L.divIcon({
            className: '',
            html: '<div class="pulse-marker" style="width:18px;height:18px;background:' + color + ';color:' + color + ';"></div>',
            iconSize: [18, 18], iconAnchor: [9, 9]
        });
    }

    function isConfirmed(m) {
        return markersData.some(o =>
            o.id !== m.id && o.type === m.type &&
            map.distance([o.lat, o.lng], [m.lat, m.lng]) <= 300
        );
    }

    function popupHtml(m) {
        const confirmed = isConfirmed(m);
        return '<div class="popup-title">' + typeIcons[m.type] + ' ' + m.type + '</div>' +
               '<div class="popup-muted">Поставил: <b>' + (m.author || '—') + '</b></div>' +
               '<div class="popup-muted">Район: ' + (m.address || 'определяется...') + '</div>' +
               '<div class="popup-muted">' + new Date(m.created_at).toLocaleString('ru-RU') + '</div>' +
               (confirmed ? '<div class="popup-confirm">✔ Статус подтверждён</div>' : '');
    }

    function drawMarkers() {
        layerGroup.clearLayers();
        Object.keys(markerRefs).forEach(k => delete markerRefs[k]);
        markersData.forEach(m => {
            const marker = L.marker([m.lat, m.lng], { icon: makeIcon(m.type) }).addTo(layerGroup);
            marker.bindPopup(popupHtml(m));
            markerRefs[m.id] = marker;
        });
    }

    async function loadMarkers() {
        const { data, error } = await supabaseClient
            .from('vinera_markers')
            .select('*')
            .order('created_at', { ascending: true });
        if (error) {
            console.error('Supabase load error:', error);
            document.getElementById('status').innerText = 'Ошибка загрузки: ' + error.message;
            return;
        }
        markersData = data || [];
        drawMarkers();
        updateCityStatus();
    }

    async function resolveAddress(m) {
        try {
            const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' +
                        m.lat + '&lon=' + m.lng + '&zoom=14&accept-language=ru';
            const res = await fetch(url);
            const data = await res.json();
            const a = data.address || {};
            const parts = [a.city || a.town || a.village || a.county, a.suburb || a.neighbourhood || a.road];
            const address = parts.filter(Boolean).join(', ') || (data.display_name || 'неизвестно');
            await supabaseClient.from('vinera_markers').update({ address }).eq('id', m.id);
            m.address = address;
            if (markerRefs[m.id]) markerRefs[m.id].setPopupContent(popupHtml(m));
        } catch (e) {
            console.warn('address error', e);
        }
    }

    function pluralizeStatus(types) {
        const threats = types.filter(t => t !== 'Тихо');
        if (threats.length === 0) {
            return { text: types.length === 0 ? '—' : '🟢 Тихо', danger: false };
        }
        const counts = {};
        threats.forEach(t => counts[t] = (counts[t] || 0) + 1);
        const unique = Object.keys(counts);
        const hasDanger = unique.some(t => dangerTypes.includes(t));
        const pluralMap = {
            'Взрыв': 'Взрывы', 'Сирена': 'Сирены', 'Ракета': 'Ракеты',
            'БПЛА': 'БПЛА', 'Истребитель': 'Истребители'
        };
        const labels = unique.map(t => counts[t] > 1 ? (pluralMap[t] || t) : t);
        return { text: '⚠ ' + labels.join(' · '), danger: hasDanger };
    }

    function updateCityStatus() {
        const box = document.getElementById('city-status');
        const nameEl = box.querySelector('.city-name');
        const stateEl = box.querySelector('.city-state');
        nameEl.textContent = (currentCity || 'ГОРОД НЕ ВЫБРАН').toUpperCase();
        if (!currentCity) {
            stateEl.textContent = '—';
            box.classList.remove('danger');
            return;
        }
        const types = markersData.filter(m => m.city === currentCity).map(m => m.type);
        const res = pluralizeStatus(types);
        stateEl.textContent = res.text;
        box.classList.toggle('danger', res.danger);
    }

    window.setMarkerType = function (type, btn) {
        currentMarkerType = type;
        document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('selected'));
        if (btn) btn.classList.add('selected');
        document.getElementById('status').innerText = 'Выбран: ' + type + '. Кликните на карту.';
    };

    map.on('click', async function (e) {
        if (!currentCity) {
            document.getElementById('status').innerText = 'Сначала найдите город через поиск!';
            return;
        }
        const m = {
            type: currentMarkerType,
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            city: currentCity,
            author: userLabel,
            address: 'определяется...'
        };
        const { data, error } = await supabaseClient
            .from('vinera_markers')
            .insert([m])
            .select()
            .single();
        if (error) {
            console.error('insert error', error);
            document.getElementById('status').innerText = 'Ошибка сохранения: ' + error.message;
            return;
        }
        markersData.push(data);
        drawMarkers();
        updateCityStatus();
        resolveAddress(data);
    });

    window.searchCity = async function () {
        const city = document.getElementById('city-input').value.trim();
        if (!city) return;
        document.getElementById('status').innerText = 'Поиск...';
        try {
            const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(city));
            const data = await res.json();
            if (data && data.length > 0) {
                map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 12);
                document.getElementById('status').innerText = 'Найден: ' + data[0].display_name;
                currentCity = data[0].display_name.split(',')[0].trim();
                updateCityStatus();
            } else {
                document.getElementById('status').innerText = 'Город не найден';
            }
        } catch (e) {
            document.getElementById('status').innerText = 'Ошибка поиска';
        }
    };

    window.toggleMenu = function () {
        document.getElementById('menu-panel').classList.toggle('open');
    };

    let adminOpen = false;
    window.toggleAdmin = function () {
        if (!isAdmin) return;
        adminOpen = !adminOpen;
        renderAdmin();
    };

    function renderAdmin() {
        const list = document.getElementById('admin-list');
        list.innerHTML = '';
        if (!adminOpen) return;

        if (markersData.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'admin-empty';
            empty.textContent = 'Меток пока нет';
            list.appendChild(empty);
            return;
        }

        markersData.forEach(function (m) {
            const item = document.createElement('div');
            item.className = 'admin-item';

            const title = document.createElement('div');
            title.innerHTML = '<b>' + typeIcons[m.type] + ' ' + m.type + '</b> — ' + (m.city || '—');
            item.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = (m.address || '...') + ' · ' + (m.author || '—');
            item.appendChild(meta);

            const btn = document.createElement('button');
            btn.className = 'del-btn';
            btn.textContent = 'Удалить';
            btn.setAttribute('data-id', m.id);
            item.appendChild(btn);

            list.appendChild(item);
        });
    }

    document.getElementById('admin-list').addEventListener('click', async function (e) {
        if (!isAdmin) return;
        const btn = e.target.closest('.del-btn');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        if (!id) return;

        const reason = window.prompt('Укажите причину удаления метки:');
        if (reason === null) return;
        if (!reason.trim()) { window.alert('Причина обязательна!'); return; }

        const { error } = await supabaseClient.from('vinera_markers').delete().eq('id', id);
        if (error) {
            console.error('delete error', error);
            window.alert('Не удалось удалить метку: ' + error.message);
            return;
        }
        markersData = markersData.filter(function (m) { return String(m.id) !== String(id); });
        drawMarkers();
        updateCityStatus();
        renderAdmin();
        window.alert('Метка удалена.\nПричина: ' + reason);
    });

    await loadMarkers();

    setInterval(async () => {
        await loadMarkers();
    }, 20000);
});
</script>
</body>
</html>
