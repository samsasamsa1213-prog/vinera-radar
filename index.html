<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vinera Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #000a0a; --panel: rgba(0, 20, 20, 0.85); --accent: #00ffcc; --accent-soft: #4db6ac; --text: #e0f2f1; --danger: #ff1744; --glass-border: rgba(0, 255, 204, 0.2); --nav-height: 70px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); }

/* Карта */
#map-container { position: absolute; inset: 0; z-index: 1; padding-bottom: var(--nav-height); background: var(--bg); }
#map { width: 100%; height: 100%; background: var(--bg); }
.dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.6) contrast(1.2) saturate(0.8); }

/* Экран входа */
#auth-screen { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at center, #002222 0%, #000a0a 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-box { background: var(--panel); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 350px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 15px; animation: fadeIn 0.5s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.auth-box h2 { margin: 0 0 10px; color: var(--accent); text-align: center; font-size: 22px; letter-spacing: 2px; font-weight: 800; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
.auth-box input { padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0, 40, 40, 0.5); color: var(--text); outline: none; font-size: 15px; }
.auth-box input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
#auth-btn { padding: 14px; background: var(--accent); color: #001414; border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; }
#auth-btn:active { transform: scale(0.97); }
#auth-toggle { padding: 12px; background: transparent; color: var(--accent-soft); border: 1px dashed var(--glass-border); border-radius: 12px; cursor: pointer; font-size: 14px; }
#auth-error { display: none; color: var(--danger); font-size: 13px; text-align: center; padding: 8px; background: rgba(255, 23, 68, 0.1); border-radius: 8px; }

/* Основное приложение */
#app { display: none; height: 100%; position: relative; }
#map-overlay { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
#map-overlay > * { pointer-events: auto; }
#top-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }

#city-status { flex: 0 1 auto; min-width: 0; padding: 10px 14px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--accent); color: var(--text); font-weight: 600; font-size: 13px; box-shadow: 0 5px 20px rgba(0, 255, 204, 0.15); max-width: 55%; overflow: hidden; }
#city-status.danger { border-color: var(--danger); box-shadow: 0 0 20px rgba(255, 23, 68, 0.5); background: rgba(40, 0, 10, 0.8); }
#city-status .city-name { color: var(--accent); font-size: 10px; display: block; letter-spacing: 1px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
#city-status.danger .city-name { color: #ff8a9b; }
#city-status .city-state { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#city-status.danger .city-state { color: #ff5252; }

/* Новый стиль заголовка VINERA RADAR */
#site-title {
    background: linear-gradient(90deg, #00ffcc, #007a66);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 3px;
    padding-top: 5px;
    white-space: nowrap;
    filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.4));
    text-transform: uppercase;
}

#search-box { display: flex; gap: 8px; }
#city-input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--panel); backdrop-filter: blur(10px); color: var(--text); outline: none; font-size: 14px; }
#search-btn { padding: 12px 18px; background: var(--accent); color: #001414; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 14px; }
#status { font-size: 11px; color: var(--accent-soft); text-align: center; padding: 6px 10px; background: var(--panel); backdrop-filter: blur(10px); border-radius: 10px; border: 1px solid var(--glass-border); margin-bottom: 5px; }

/* Кнопка "Сообщить" по центру */
#show-markers-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--nav-height) + 15px);
    z-index: 1000; padding: 12px 24px; border-radius: 24px;
    background: var(--accent); color: #001414; border: none;
    box-shadow: 0 5px 20px rgba(0, 255, 204, 0.5);
    font-weight: 800; font-size: 15px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; transition: transform 0.2s;
}
#show-markers-btn:active { transform: translateX(-50%) scale(0.95); }
#show-markers-btn svg { width: 20px; height: 20px; }

/* Шторка */
#markers-sheet-overlay { position: absolute; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); display: none; opacity: 0; transition: opacity 0.3s; }
#markers-sheet-overlay.active { display: block; opacity: 1; }
#markers-sheet { position: absolute; bottom: var(--nav-height); left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--accent); border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 2001; }
#markers-sheet.active { transform: translateY(0); }
.sheet-handle { width: 40px; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 10px; margin: 0 auto 20px; }
#types-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 10px; }
.marker-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid transparent; background: rgba(0, 40, 40, 0.8); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text); font-weight: 600; font-size: 10px; transition: all 0.2s; padding: 0; line-height: 1.1; text-align: center; }
.marker-btn svg { width: 28px; height: 28px; display: block; }
.marker-btn:active { transform: scale(0.9); }
.marker-btn.selected { border-color: var(--accent); background: rgba(0, 255, 204, 0.15); box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }

/* Метки на карте */
.pulse-marker { border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 15px currentColor; animation: pulse 1.5s infinite ease-in-out; }
.pulse-marker svg { width: 60%; height: 60%; display: block; }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); backdrop-filter: blur(15px); color: var(--text); border: 1px solid var(--accent); border-radius: 14px; }
.leaflet-popup-content { margin: 12px 16px; font-size: 13px; line-height: 1.5; }
.popup-confirm { display: inline-block; margin-top: 8px; padding: 4px 10px; background: rgba(0, 200, 83, 0.2); color: #00e676; border: 1px solid #00e676; border-radius: 8px; font-weight: 800; font-size: 11px; }
.popup-title { color: var(--accent); font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.popup-title svg { width: 20px; height: 20px; }
.popup-muted { color: var(--accent-soft); font-size: 12px; margin-top: 3px; }

/* Нижняя навигация */
#bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: var(--panel); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); z-index: 2500; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: var(--accent-soft); font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s; flex: 1; height: 100%; }
.nav-btn svg { width: 24px; height: 24px; transition: 0.3s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: translateY(-3px); filter: drop-shadow(0 0 8px var(--accent)); }

/* События */
#feed-screen { position: absolute; inset: 0; bottom: var(--nav-height); background: var(--bg); z-index: 1500; display: none; flex-direction: column; padding: 20px; overflow-y: auto; animation: slideIn 0.3s ease-out; }
#feed-screen.active { display: flex; }
@keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.feed-header h2 { margin: 0; color: var(--accent); font-size: 20px; font-weight: 800; letter-spacing: 1px; }
.time-filter { background: var(--panel); color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }
.feed-list { display: flex; flex-direction: column; gap: 10px; }
.feed-item { background: var(--panel); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px; }
.feed-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.feed-content { flex: 1; }
.feed-title { font-weight: 800; font-size: 14px; color: var(--text); margin-bottom: 4px; }
.feed-meta { font-size: 11px; color: var(--accent-soft); }
.feed-empty { text-align: center; color: var(--accent-soft); margin-top: 50px; font-size: 14px; }

/* Профиль */
#profile-screen { position: absolute; inset: 0; bottom: var(--nav-height); background: var(--bg); z-index: 1500; display: none; flex-direction: column; padding: 20px; overflow-y: auto; animation: slideIn 0.3s ease-out; }
#profile-screen.active { display: flex; }
.profile-card { background: var(--panel); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 20px; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #005a52); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-weight: 800; }
.profile-name { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 5px; }
.profile-role { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; background: rgba(0, 255, 204, 0.1); color: var(--accent); border: 1px solid var(--accent); }
.profile-stats { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); }
.stat-item { text-align: center; }
.stat-value { font-size: 18px; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--accent-soft); margin-top: 2px; }

.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-item { background: var(--panel); border: 1px solid var(--glass-border); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; cursor: pointer; }
.menu-item:active { background: rgba(0, 40, 40, 0.9); transform: scale(0.98); }
.menu-item.danger { color: var(--danger); border-color: rgba(255, 23, 68, 0.3); }
.menu-item svg { width: 20px; height: 20px; opacity: 0.7; }

#admin-panel-content { display: none; margin-top: 20px; flex-direction: column; gap: 15px; }
#admin-panel-content.active { display: flex; animation: fadeIn 0.3s; }
.admin-tabs { display: flex; gap: 10px; }
.admin-tab { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--panel); color: var(--accent-soft); font-weight: 800; font-size: 13px; cursor: pointer; text-align: center; transition: 0.2s; }
.admin-tab.active { background: rgba(0, 255, 204, 0.1); color: var(--accent); border-color: var(--accent); }
.admin-list { display: flex; flex-direction: column; gap: 10px; }
.admin-item { background: var(--panel); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; font-size: 13px; }
.admin-item .meta { color: var(--accent-soft); font-size: 11px; margin-top: 4px; }
.admin-item .del-btn { margin-top: 10px; padding: 8px 14px; background: rgba(255, 23, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; width: 100%; }
.clear-all-btn { width: 100%; padding: 14px; background: rgba(255, 23, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }

@media(max-width:360px){ .marker-btn { width: 60px; height: 60px; font-size: 9px; } .marker-btn svg { width: 24px; height: 24px; } #site-title { font-size: 16px; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    window.addEventListener('load',function(){
const tg=window.Telegram?window.Telegram.WebApp:null;if(tg&&tg.expand)tg.expand();

window.onTurnstileSuccess = function(token) { window.turnstileToken = token; };

async function checkAccess() {
    if (!tg || !tg.initData) {
        document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#fff;background:#000a0a;height:100vh;font-family:sans-serif;"><h2 style="color:#00ffcc;margin-top:50px;">Доступ запрещен</h2><p style="margin-top:20px;font-size:16px;">Откройте радар через Telegram-бота <b>@vinera_radar_bot</b></p></div>';
        return false;
    }
    return true;
}

checkAccess().then(allowed => {
    if (!allowed) return;

    const SUPABASE_URL='https://hpzemwurwkuthcgmtvlw.supabase.co';
    const SUPABASE_KEY='sb_publishable_H5gZUb84H06cxMb1OfH5Mg_eIWaikbz';
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    const map=L.map('map',{zoomControl:false}).setView([55.7558,37.6173],5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19,className:'dark-tiles'}).addTo(map);
    let currentMarkerType='БПЛА',currentCity=null,markersData=[],feedData=[],currentUser=null,currentRole='user',currentBanned=false,currentPhone=null,currentTotalMarkers=0;
    let recentMarkerTimes=[];const MAX_MARKERS=2,COOLDOWN_MS=30000;
    
    function canPlaceMarker(){const now=Date.now();recentMarkerTimes=recentMarkerTimes.filter(t=>now-t<COOLDOWN_MS);if(recentMarkerTimes.length<MAX_MARKERS)return{allowed:true,wait:0};const oldest=Math.min.apply(null,recentMarkerTimes);return{allowed:false,wait:Math.ceil((COOLDOWN_MS-(now-oldest))/1000)};}
    
    const METADATA={'БПЛА':{color:'#00bfa5',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="3"/><path d="M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>'},'Ракета':{color:'#ff5252',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c2 3 3 6 3 9v6l-3 3-3-3v-6c0-3 1-6 3-9z"/><path d="M9 14l-3 4M15 14l3 4M12 20v2"/></svg>'},'Истребитель':{color:'#40c4ff',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 7h6l-2 3h-4l1 6-3-2-3 2 1-6H6l-2-3h6l2-7z"/></svg>'},'Сирена':{color:'#b388ff',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 0 1 16 0v4H4v-4z"/><path d="M12 2v2M3 8l2 2M21 8l-2 2M2 14h2M20 14h2M8 18v2M16 18v2"/></svg>'},'Взрыв':{color:'#ffc107',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></svg>'},'Тихо':{color:'#00e676',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>'}};
    const dangerTypes=['Взрыв','Сирена','Ракета'];const LIFETIME_MS=900000;
    const layerGroup=L.layerGroup().addTo(map);const markerRefs={};
    const authScreen=document.getElementById('auth-screen'),authLogin=document.getElementById('auth-login'),authPassword=document.getElementById('auth-password'),authBtn=document.getElementById('auth-btn'),authToggle=document.getElementById('auth-toggle'),authTitle=document.getElementById('auth-title'),authError=document.getElementById('auth-error');
    let isRegisterMode=false;
    function showAuthError(msg){authError.textContent=msg;authError.style.display='block';}
    
    authToggle.addEventListener('click',function(){isRegisterMode=!isRegisterMode;authTitle.textContent=isRegisterMode?'РЕГИСТРАЦИЯ':'ВХОД';authBtn.textContent=isRegisterMode?'Зарегистрироваться':'Войти';authToggle.textContent=isRegisterMode?'У меня уже есть аккаунт':'Создать аккаунт';authError.style.display='none';});
    
    async function handleAuth(){
        const login=authLogin.value.trim().toLowerCase(),password=authPassword.value;
        if(!login||!password){showAuthError('Введите логин и пароль');return;}
        if(login.length<3){showAuthError('Логин не короче 3 символов');return;}
        if(password.length<6){showAuthError('Пароль не короче 6 символов');return;}
        
        authBtn.disabled=true;authBtn.textContent='Подождите...';authError.style.display='none';
        const email=login+'@vinera.app';
        
        try{
            if(isRegisterMode){
                const tgUser = tg ? tg.initDataUnsafe?.user : null;
                if (tgUser) {
                    const { data: reg } = await supabaseClient.from('registrations').select('count').eq('telegram_id', tgUser.id).maybeSingle();
                    const currentCount = reg ? reg.count : 0;
                    if (currentCount >= 3) throw new Error('Лимит аккаунтов исчерпан!');
                    await supabaseClient.from('registrations').upsert({ telegram_id: tgUser.id, count: currentCount + 1 });
                }

                const{data,error}=await supabaseClient.auth.signUp({
                    email: email, password: password,
                    options: { captchaToken: window.turnstileToken }
                });
                
                if(error)throw error;
                if(data.user){ 
                    await supabaseClient.from('profiles').insert({
                        id:data.user.id, username:login, role:'user', total_markers:0, is_banned:false,
                        telegram_id: tgUser ? tgUser.id : null
                    }); 
                }
            }else{
                const{error}=await supabaseClient.auth.signInWithPassword({email:email,password:password});
                if(error)throw error;
            }
            await checkSession();
        }catch(e){
            showAuthError(e.message||'Ошибка входа');
        }finally{
            authBtn.disabled=false;
            authBtn.textContent=isRegisterMode?'Зарегистрироваться':'Войти';
        }
    }
    
    authBtn.addEventListener('click',handleAuth);
    authPassword.addEventListener('keydown',function(e){if(e.key==='Enter')handleAuth();});
    
    async function updateCounters(){try{const fiveMinAgo=new Date(Date.now()-5*60*1000).toISOString();const{count:online}=await supabaseClient.from('profiles').select('*',{count:'exact',head:true}).gt('last_seen_at',fiveMinAgo);const o=document.getElementById('online-count');if(o&&online!==null)o.textContent=online;}catch(e){}}
    
    async function checkSession(){
        const{data}=await supabaseClient.auth.getSession();
        if(data.session){
            const{data:profile}=await supabaseClient.from('profiles').select('*').eq('id',data.session.user.id).maybeSingle();
            
            currentUser=profile?profile.username:'user';
            currentRole=(profile&&profile.role)?profile.role:'user';
            currentBanned=(profile&&profile.is_banned)?true:false;
            currentPhone=(profile&&profile.phone)?profile.phone:null;
            currentTotalMarkers=(profile&&profile.total_markers)?profile.total_markers:0;
            
            if(currentUser==='bihepka'||currentUser==='Hollisheetq'){ currentRole='admin'; currentBanned=false; }

            if(currentBanned){
                await supabaseClient.auth.signOut(); authScreen.style.display='none'; document.getElementById('app').style.display='none';
                document.body.innerHTML = '<div style="padding:20px;text-align:center;color:#fff;background:#1a0000;height:100vh;padding-top:50px;"><h2 style="color:#ff1744;">ВЫ ЗАБЛОКИРОВАНЫ</h2><p>Ваш аккаунт заблокирован навсегда.<br>По вопросам: <b>@Hollisheetq</b></p></div>';
                return;
            }

            document.getElementById('profile-name').textContent = currentUser;
            document.getElementById('profile-avatar-letter').textContent = currentUser.charAt(0).toUpperCase();
            document.getElementById('profile-stat-markers').textContent = currentTotalMarkers;
            
            let roleText = 'ПОЛЬЗОВАТЕЛЬ';
            if(currentRole==='admin') roleText = 'АДМИНИСТРАТОР';
            else if(currentRole==='moderator') roleText = 'МОДЕРАТОР';
            
            document.getElementById('profile-role-badge').textContent = roleText;
            document.getElementById('profile-stat-role').textContent = currentRole;

            if(currentRole === 'admin' || currentRole === 'moderator') {
                document.getElementById('admin-toggle-btn').style.display = 'flex';
            }

            authScreen.style.display='none'; 
            document.getElementById('app').style.display='block';
            
            setTimeout(function(){map.invalidateSize();},200); 
            await loadMarkers(); 
            await updateCounters();
        }else{ authScreen.style.display='flex'; document.getElementById('app').style.display='none'; }
    }
    
    window.logout=async function(){await supabaseClient.auth.signOut();currentUser=null;currentRole='user';currentBanned=false;currentPhone=null;markersData=[];feedData=[];recentMarkerTimes=[];drawMarkers();await checkSession();};
    
    function makeIcon(type){const meta=METADATA[type]||METADATA['БПЛА'];return L.divIcon({className:'',html:'<div class="pulse-marker" style="width:22px;height:22px;background:'+meta.color+';color:'+meta.color+';">'+meta.svg+'</div>',iconSize:[22,22],iconAnchor:[11,11]});}
    function isConfirmed(m){return markersData.some(o=>o.id!==m.id&&o.type===m.type&&map.distance([o.lat,o.lng],[m.lat,m.lng])<=300);}
    function popupHtml(m){const meta=METADATA[m.type]||METADATA['БПЛА'];const confirmed=isConfirmed(m);return '<div class="popup-title">'+meta.svg+' '+escapeHtml(m.type)+'</div><div class="popup-muted">Поставил: <b>'+escapeHtml(m.author)+'</b></div><div class="popup-muted">Район: '+escapeHtml(m.address||'определяется...')+'</div><div class="popup-muted">'+new Date(m.created_at).toLocaleString('ru-RU')+'</div>'+(confirmed?'<div class="popup-confirm">✔ Статус подтверждён</div>':'');}
    
    function drawMarkers(){
        layerGroup.clearLayers();
        Object.keys(markerRefs).forEach(k=>delete markerRefs[k]);
        markersData.forEach(m=>{
            const marker=L.marker([m.lat,m.lng],{icon:makeIcon(m.type)}).addTo(layerGroup);
            marker.bindPopup(popupHtml(m));
            markerRefs[m.id]=marker;
        });
    }
    
    async function loadMarkers(){
        const{data,error}=await supabaseClient.from('vinera_markers').select('*').order('created_at',{ascending:false});
        if(error){document.getElementById('status').innerText='Ошибка: '+error.message;return;}
        
        const now = Date.now();
        markersData=(data||[]).filter(m=>(now-new Date(m.created_at).getTime())<LIFETIME_MS);
        
        const oneDayAgo = now - (24 * 60 * 60 * 1000);
        feedData = (data||[]).filter(m => new Date(m.created_at).getTime() > oneDayAgo);
        
        drawMarkers();
        updateCityStatus();
        renderFeed();
    }
    
    function renderFeed(){
        const list = document.getElementById('feed-list');
        list.innerHTML = '';
        if(feedData.length === 0) {
            list.innerHTML = '<div class="feed-empty">За последние 24 часа событий не было</div>';
            return;
        }
        
        feedData.forEach(m => {
            const meta = METADATA[m.type] || METADATA['БПЛА'];
            const item = document.createElement('div');
            item.className = 'feed-item';
            const time = new Date(m.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
            
            item.innerHTML = `
                <div class="feed-icon" style="background:${meta.color}20; border: 1px solid ${meta.color};">${meta.svg.replace('stroke="#fff"', 'stroke="'+meta.color+'"')}</div>
                <div class="feed-content">
                    <div class="feed-title">${escapeHtml(m.type)} — ${escapeHtml(m.city||'Неизвестно')}</div>
                    <div class="feed-meta">${time} · ${escapeHtml(m.author||'Аноним')}</div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    async function resolveAddress(m){try{const url='https://nominatim.openstreetmap.org/reverse?format=json&lat='+m.lat+'&lon='+m.lng+'&zoom=14&accept-language=ru';const res=await fetch(url);const data=await res.json();const a=data.address||{};const parts=[a.city||a.town||a.village||a.county,a.suburb||a.neighbourhood||a.road];const address=parts.filter(Boolean).join(', ')||(data.display_name||'неизвестно');await supabaseClient.from('vinera_markers').update({address:address}).eq('id',m.id);m.address=address;if(markerRefs[m.id])markerRefs[m.id].setPopupContent(popupHtml(m));}catch(e){}}
    
    function pluralizeStatus(types){const threats=types.filter(t=>t!=='Тихо');if(threats.length===0)return{text:types.length===0?'—':'Тихо',danger:false};const counts={};threats.forEach(t=>counts[t]=(counts[t]||0)+1);const unique=Object.keys(counts);const hasDanger=unique.some(t=>dangerTypes.includes(t));const pm={'Взрыв':'Взрывы','Сирена':'Сирены','Ракета':'Ракеты','БПЛА':'БПЛА','Истребитель':'Истребители'};const labels=unique.map(t=>counts[t]>1?(pm[t]||t):t);return{text:'⚠ '+labels.join(' · '),danger:hasDanger};}
    
    function updateCityStatus(){const box=document.getElementById('city-status'),nameEl=box.querySelector('.city-name'),stateEl=box.querySelector('.city-state');nameEl.textContent=(currentCity||'ГОРОД НЕ ВЫБРАН').toUpperCase();if(!currentCity){stateEl.textContent='—';box.classList.remove('danger');return;}const types=markersData.filter(m=>m.city===currentCity).map(m=>m.type);const res=pluralizeStatus(types);stateEl.textContent=res.text;box.classList.toggle('danger',res.danger);}
    
    window.setMarkerType=function(type,btn){currentMarkerType=type;document.querySelectorAll('.marker-btn').forEach(b=>b.classList.remove('selected'));if(btn)btn.classList.add('selected');document.getElementById('status').innerText='Выбран: '+type+'. Кликните на карту.';};
    
    map.on('click',async function(e){
        if (currentUser !== 'bihepka' && currentUser !== 'Hollisheetq') {
            if (!currentPhone) {
                document.getElementById('status').innerHTML = '<span style="color:#ff5252;font-weight:bold;">⚠ Чтобы ставить метки, подтвердите номер в боте!</span>';
                return;
            }
        }

        if(!currentCity){document.getElementById('status').innerText='Сначала найдите город через поиск!';return;}
        document.getElementById('status').innerText='Сохранение...';
        const m={type:currentMarkerType,lat:e.latlng.lat,lng:e.latlng.lng,city:currentCity,author:currentUser||'Аноним',address:'определяется...'};
        const{data,error}=await supabaseClient.from('vinera_markers').insert([m]).select().single();
        if(error){document.getElementById('status').innerText='Ошибка: '+error.message;return;}
        markersData.unshift(data);drawMarkers();updateCityStatus();resolveAddress(data);loadMarkers();
        document.getElementById('status').innerText='Метка поставлена ✔';
    });
    
    window.searchCity=async function(){
        const city=document.getElementById('city-input').value.trim();if(!city)return;
        document.getElementById('status').innerText='Поиск...';
        try{
            const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(city));
            const data=await res.json();
            if(data&&data.length>0){
                map.setView([parseFloat(data[0].lat),parseFloat(data[0].lon)],12);
                document.getElementById('status').innerText='Найден: '+data[0].display_name;
                currentCity=data[0].display_name.split(',')[0].trim();updateCityStatus();
            }else{document.getElementById('status').innerText='Город не найден';}
        }catch(e){document.getElementById('status').innerText='Ошибка поиска';}
    };

    window.switchTab = function(tab) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('feed-screen').classList.remove('active');
        document.getElementById('profile-screen').classList.remove('active');
        document.getElementById('map-container').style.display = 'block';
        
        if(tab === 'map') {
            document.querySelectorAll('.nav-btn')[0].classList.add('active');
            setTimeout(() => map.invalidateSize(), 100);
        } 
        else if(tab === 'feed') {
            document.querySelectorAll('.nav-btn')[1].classList.add('active');
            document.getElementById('map-container').style.display = 'none';
            document.getElementById('feed-screen').classList.add('active');
            loadMarkers();
        } 
        else if(tab === 'profile') {
            document.querySelectorAll('.nav-btn')[2].classList.add('active');
            document.getElementById('map-container').style.display = 'none';
            document.getElementById('profile-screen').classList.add('active');
        }
    };

    window.toggleMarkersSheet = function() {
        const sheet = document.getElementById('markers-sheet');
        const overlay = document.getElementById('markers-sheet-overlay');
        
        if (sheet.classList.contains('active')) {
            sheet.classList.remove('active');
            overlay.classList.remove('active');
        } else {
            sheet.classList.add('active');
            overlay.classList.add('active');
        }
    };
        // ===== АДМИН-ПАНЕЛЬ =====
    let adminOpen = false;
    let adminTab = 'markers';

    window.toggleAdminPanel = function() {
        adminOpen = !adminOpen;
        const panel = document.getElementById('admin-panel-content');
        if (adminOpen) {
            panel.classList.add('active');
            renderAdmin();
        } else {
            panel.classList.remove('active');
        }
    };

    window.switchAdminTab = function(tab) {
        adminTab = tab;
        document.getElementById('tab-markers').classList.toggle('active', tab === 'markers');
        document.getElementById('tab-users').classList.toggle('active', tab === 'users');
        
        // Показываем/скрываем кнопку очистки
        document.getElementById('clear-all-btn').style.display = (tab === 'markers') ? 'block' : 'none';
        
        renderAdmin();
    };

    // Кнопка очистки всех меток
    document.getElementById('clear-all-btn').onclick = async function() {
        if(!window.confirm('Вы уверены, что хотите удалить ВСЕ метки с карты? Это действие нельзя отменить.')) return;
        
        this.textContent = 'Очистка...';
        this.disabled = true;
        
        const { error } = await supabaseClient.from('vinera_markers').delete().neq('id', 0);
        
        if (error) {
            window.alert('Ошибка при очистке: ' + error.message);
        } else {
            markersData = [];
            feedData = [];
            drawMarkers();
            updateCityStatus();
            renderFeed();
            window.alert('Все метки успешно удалены!');
        }
        
        this.textContent = '🗑 Очистить все метки';
        this.disabled = false;
        renderAdmin();
    };

    async function renderAdmin() {
        const content = document.getElementById('admin-content');
        if (!content) return;
        
        content.innerHTML = '<div class="admin-empty">Загрузка...</div>';
        
        if (adminTab === 'markers') {
            if (markersData.length === 0) {
                content.innerHTML = '<div class="admin-empty">Активных меток нет</div>';
                return;
            }
            content.innerHTML = '';
            markersData.forEach(m => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <b>${escapeHtml(m.type)}</b> — ${escapeHtml(m.city || '—')}
                    <div class="meta">${escapeHtml(m.address || '...')} · ${escapeHtml(m.author || '—')}</div>
                    <button class="del-btn" onclick="deleteMarker('${m.id}')">Удалить</button>
                `;
                content.appendChild(item);
            });
        } 
        else if (adminTab === 'users') {
            const { data: users, error } = await supabaseClient.from('profiles').select('*').order('total_markers', { ascending: false });
            
            if (error) {
                content.innerHTML = `<div class="admin-empty">Ошибка: ${error.message}</div>`;
                return;
            }
            if (!users || users.length === 0) {
                content.innerHTML = '<div class="admin-empty">Пользователей нет</div>';
                return;
            }
            
            content.innerHTML = '';
            users.forEach(u => {
                if (u.username === 'bihepka' || u.username === 'Hollisheetq') return; // не показываем себя
                
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.style.opacity = u.is_banned ? '0.6' : '1';
                
                const badge = u.is_banned ? '<span style="color:var(--danger);font-size:10px;">[БАН]</span>' : '';
                
                item.innerHTML = `
                    <div style="display:flex;justify-content:space-between;">
                        <b>${escapeHtml(u.username || 'без имени')}</b>
                        ${badge}
                    </div>
                    <div class="meta">Меток: ${u.total_markers || 0} · Роль: ${u.role || 'user'}</div>
                    <div style="display:flex;gap:5px;margin-top:10px;">
                        ${!u.is_banned ? 
                            `<button onclick="setBan('${u.id}', true)" style="flex:1;padding:8px;background:rgba(255,23,68,0.1);color:var(--danger);border:1px solid var(--danger);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">Забанить</button>` : 
                            `<button onclick="setBan('${u.id}', false)" style="flex:1;padding:8px;background:rgba(0,200,83,0.1);color:#00c853;border:1px solid #00c853;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">Разбанить</button>`
                        }
                        ${u.role !== 'moderator' ? 
                            `<button onclick="setUserRole('${u.id}', 'moderator')" style="flex:1;padding:8px;background:rgba(0,191,165,0.1);color:var(--accent);border:1px solid var(--accent);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">Модер</button>` : 
                            `<button onclick="setUserRole('${u.id}', 'user')" style="flex:1;padding:8px;background:rgba(255,152,0,0.1);color:#ff9800;border:1px solid #ff9800;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">Снять</button>`
                        }
                    </div>
                `;
                content.appendChild(item);
            });
        }
    }

    window.deleteMarker = async function(id) {
        const reason = window.prompt('Причина удаления метки:');
        if (reason === null) return;
        if (!reason.trim()) { window.alert('Причина обязательна!'); return; }
        
        const { error } = await supabaseClient.from('vinera_markers').delete().eq('id', id);
        if (error) { window.alert('Ошибка: ' + error.message); return; }
        
        markersData = markersData.filter(m => String(m.id) !== String(id));
        feedData = feedData.filter(m => String(m.id) !== String(id));
        drawMarkers(); updateCityStatus(); renderFeed(); renderAdmin();
        window.alert('Метка удалена.\nПричина: ' + reason);
    };

    window.setBan = async function(id, ban) {
        const { error } = await supabaseClient.from('profiles').update({ is_banned: ban }).eq('id', id);
        if (error) { window.alert('Ошибка: ' + error.message); return; }
        renderAdmin();
    };

    window.setUserRole = async function(id, role) {
        const { error } = await supabaseClient.from('profiles').update({ role: role }).eq('id', id);
        if (error) { window.alert('Ошибка: ' + error.message); return; }
        renderAdmin();
    };

    // Запуск
    checkSession();
    setInterval(function(){updateCounters();},30000);
    setInterval(async function(){await loadMarkers();},20000);
    
    // Автоудаление старых меток
    setInterval(async function(){
        const cutoff=new Date(Date.now()-LIFETIME_MS).toISOString();
        await supabaseClient.from('vinera_markers').delete().lt('created_at',cutoff);
        await loadMarkers();
    },60000);

}); // Конец checkAccess().then()
}); // Конец window.addEventListener('load')
</script>
</body>
</html>
